name: Cleanup old tags

# One-shot maintenance: delete releases/tags that point at pre-history-rewrite
# commits so those commits become unreachable. Run manually, then removed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v0.6.0 v0.6.1; do
            gh release delete "$t" --repo "${{ github.repository }}" --cleanup-tag --yes \
              || echo "release $t not found (already gone)"
          done
