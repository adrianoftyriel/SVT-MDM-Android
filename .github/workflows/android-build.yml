name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # needed to create/update Releases

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Release build: non-debuggable, signed with the committed stable key.
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: svt-mdm-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Publish a GitHub Release with the APK (only for main builds).
      - name: Read app version
        if: github.ref == 'refs/heads/main'
        id: ver
        run: |
          v=0.8.2
          echo "version=" >> ""

      - name: Stage APKs
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk "svt-mdm-${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "svt-mdm-latest.apk"

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "SVT MDM ${{ steps.ver.outputs.version }}"
          files: |
            svt-mdm-${{ steps.ver.outputs.version }}.apk
            svt-mdm-latest.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Android agent for SVT MDM, version ${{ steps.ver.outputs.version }}.

            Signed with the project sideloading key (installs over previous
            versions in place). Not a Play Store build - sideload onto devices
            you own. See provisioning/ for setup.
